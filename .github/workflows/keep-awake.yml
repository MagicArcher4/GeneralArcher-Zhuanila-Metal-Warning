
name: Streamlit Keep Awake

on:
  schedule:
    # GitHub Actions 使用 UTC；每 6 小时访问一次
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  ping-app:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Wake and check Streamlit app
        shell: bash
        run: |
          set -euo pipefail

          APP_URL="https://generalarcher-zhuanila-metal-warning1.streamlit.app"

          echo "Pinging Streamlit app: ${APP_URL}"

          HTTP_CODE="$(curl \
            --silent \
            --show-error \
            --location \
            --max-redirs 10 \
            --connect-timeout 15 \
            --max-time 60 \
            --output /dev/null \
            --write-out "%{http_code}" \
            --user-agent "Mozilla/5.0 (compatible; GitHubActions-KeepAlive/1.0)" \
            "${APP_URL}/")"

          echo "Final HTTP status: ${HTTP_CODE}"

          if [[ "${HTTP_CODE}" =~ ^2[0-9][0-9]$ ]]; then
            echo "SUCCESS: Streamlit app responded successfully."
          else
            echo "ERROR: Streamlit app returned HTTP ${HTTP_CODE}."
            exit 1
          fi

